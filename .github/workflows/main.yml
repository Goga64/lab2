name: Run RawToCSV and Commit Output

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # ✅ Allow the action to push to the repo

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # ✅ Keeps the token for pushing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyLTSpice numpy

      - name: Run RawToCSV.py
        run: |
          python RawToCSV.py

      - name: Commit and push RLC.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RLC.csv
          git commit -m "Auto-generated RLC.csv from workflow" || echo "No changes to commit"
          git push

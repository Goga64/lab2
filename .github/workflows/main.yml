name: Run RawToCSV and Commit Output

on:
  push:
    branches:
      - main
  workflow_dispatch:  # allows manual triggering from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # or another version you need

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyLTSpice numpy

      # Step 4: Run the Python script
      - name: Run RawToCSV.py
        run: |
          python RawToCSV.py

      # Step 5: Commit and push output CSV file
      - name: Commit and push RLC.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RLC.csv
          git commit -m "Auto-generated RLC.csv from workflow" || echo "No changes to commit"
          git push
